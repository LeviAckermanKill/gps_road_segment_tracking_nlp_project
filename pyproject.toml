[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-map-matching"
version = "1.0.0"
description = "GPS map matching using Hidden Markov Models and Viterbi decoding"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "osmnx>=1.9",
    "shapely>=2.0",
    "pyproj>=3.5",
    "geojson>=3.0",
    "gpxpy>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "gunicorn>=21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
